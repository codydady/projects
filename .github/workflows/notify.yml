name: Notify Mobile Clients

on:
  # 1. Enables manual triggering from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      test_slug:
        description: 'Slug to send via FCM (e.g. test-slug-123 or an existing slug from posts.json)'
        required: true
        default: 'heibabyslug'

  # 2. Automated trigger when posts.json is modified on main
  push:
    branches:
      - main  # Triggers when changes are pushed to main
    paths:
      - 'templepages-github-site/www.templepages.com/posts.json'

jobs:
  send-fcm-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # Simplified: Default fetch-depth: 1 is fine since we no longer inspect git history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Extract Slug, Poll CDN, and Send FCM Notification
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_SLUG: ${{ github.event.inputs.test_slug }}
          JSON_FILE_PATH: "templepages-github-site/www.templepages.com/posts.json"
        run: |
          python - << 'EOF'
          import os, json, time, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          event_name = os.environ.get("EVENT_NAME", "")
          test_slug = os.environ.get("TEST_SLUG", "").strip()
          json_path = os.environ.get("JSON_FILE_PATH", "")

          new_slug = ""
          post_title = "New Temple Post"

          # ------------------------------------------------------------------------
          # STEP 1: RESOLVE SLUG AND TITLE (READS FIRST ITEM IN POSTS.JSON)
          # ------------------------------------------------------------------------
          if event_name == "workflow_dispatch" and test_slug:
              new_slug = test_slug
              print(f"[Manual Run] Using override test slug: '{new_slug}'")
              
              # Try finding title for manual test slug if present in posts.json
              if os.path.exists(json_path):
                  try:
                      with open(json_path, 'r', encoding='utf-8') as f:
                          posts = json.load(f)
                          for post in posts:
                              if post.get("slug") == new_slug:
                                  post_title = post.get("title", post_title)
                                  break
                  except Exception as e:
                      print(f"Warning parsing JSON title: {e}")
          else:
              # Organic Push: Directly read the FIRST item from posts.json
              if os.path.exists(json_path):
                  try:
                      with open(json_path, 'r', encoding='utf-8') as f:
                          posts = json.load(f)
                          if isinstance(posts, list) and len(posts) > 0:
                              first_post = posts[0]
                              new_slug = first_post.get("slug", "").strip()
                              post_title = first_post.get("title", post_title)
                              print(f"[Organic Push] Read latest slug from posts[0]: '{new_slug}'")
                  except Exception as e:
                      print(f"Error reading posts.json: {e}")

          if not new_slug:
              print("ERROR: Could not resolve a valid slug. Aborting FCM notification.")
              exit(1)

          # ------------------------------------------------------------------------
          # STEP 2: ACTIVE POLLING FOR GITHUB PAGES DEPLOYMENT (HTTP 200 CHECK)
          # ------------------------------------------------------------------------
          image_url = f"https://www.templepages.com/posts/{new_slug}/img1.jpg"
          print(f"Polling GitHub Pages CDN for image availability: {image_url}")

          max_attempts = 30  # 30 attempts * 10s = 5 minutes max wait time
          image_ready = False

          for attempt in range(1, max_attempts + 1):
              try:
                  res = requests.head(image_url, timeout=5)
                  if res.status_code == 200:
                      print(f"SUCCESS: Image is live on CDN (Attempt {attempt})!")
                      image_ready = True
                      break
                  else:
                      print(f"Image not live yet (HTTP {res.status_code}). Retrying in 10s... ({attempt}/{max_attempts})")
              except Exception as e:
                  print(f"Polling error ({e}). Retrying in 10s... ({attempt}/{max_attempts})")
              
              time.sleep(10)

          if not image_ready:
              print("WARNING: Active polling timed out after 5 minutes. Attempting to send FCM anyway...")

          # ------------------------------------------------------------------------
          # STEP 3: DISPATCH FCM PUSH NOTIFICATION
          # ------------------------------------------------------------------------
          raw_json = os.environ.get("SERVICE_ACCOUNT", "")
          key_data = json.loads(raw_json)

          creds = service_account.Credentials.from_service_account_info(
              key_data,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          creds.refresh(Request())

          project_id = key_data["project_id"]
          commit_sha = os.environ.get("COMMIT_SHA", "")

          url = f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send"
          headers = {
              "Authorization": f"Bearer {creds.token}",
              "Content-Type": "application/json"
          }

          payload = {
              "message": {
                  "topic": "updates",
                  "notification": {
                      "title": post_title,
                      "body": "Tap to view full temple details",
                      "image": image_url
                  },
                  "data": {
                      "newslug": new_slug,
                      "version": commit_sha,
                      "url": "https://www.templepages.com/posts.json",
                      "title": post_title,
                      "image_url": image_url
                  },
                  "android": {
                      "priority": "HIGH",
                      "notification": {
                          "image": image_url
                      }
                  }
              }
          }

          res = requests.post(url, json=payload, headers=headers)
          print("FCM Response Code:", res.status_code)
          print("FCM Response Body:", res.text)

          if res.status_code != 200:
              exit(1)
          EOF
