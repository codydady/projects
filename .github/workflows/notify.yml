name: Notify Mobile Clients

on:
  # 1. Enables manual triggering from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      test_slug:
        description: 'Slug to send via FCM (e.g. test-slug-123 or an existing slug from posts.json)'
        required: true
        default: 'heibabyslug'

  # 2. Automated trigger when posts.json is modified on main
  push:
    branches:
      - main  # Triggers when changes are pushed to main
    paths:
      # Action ONLY triggers when posts.json is modified
      - 'templepages-github-site/www.templepages.com/posts.json'

jobs:
  send-fcm-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required to compare current commit against parent commit

      - name: Extract New Slug via Git Diff or Manual Input
        id: extract_slug
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            NEW_SLUG="${{ github.event.inputs.test_slug }}"
            echo "Manual run triggered via UI. Using provided slug: $NEW_SLUG"
          else
            JSON_PATH="templepages-github-site/www.templepages.com/posts.json"
            
            # Isolate added lines in posts.json containing the "slug" field
            NEW_SLUG=$(git diff HEAD~1 HEAD -- "$JSON_PATH" | grep '^+[^+]' | grep '"slug":' | sed -E 's/.*"slug": *"([^"]+)".*/\1/' | head -n 1)

            if [ -z "$NEW_SLUG" ]; then
              echo "No new slug detected in git diff."
            else
              echo "Detected new slug: $NEW_SLUG"
            fi
          fi

          echo "slug=$NEW_SLUG" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # Simple 300-second delay to give all images/content time to propagate
      # ------------------------------------------------------------------------
      - name: Wait 5 Minutes for Site Deployment
        if: ${{ steps.extract_slug.outputs.slug != '' }}
        run: |
          echo "Waiting 300 seconds for GitHub Pages deployment and image assets to go live..."
          sleep 300
          echo "Delay finished. Proceeding with FCM notification."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Send FCM Notification
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COMMIT_SHA: ${{ github.sha }}
          NEW_SLUG: ${{ steps.extract_slug.outputs.slug }}
          JSON_FILE_PATH: "templepages-github-site/www.templepages.com/posts.json"
        run: |
          python - << 'EOF'
          import os, json, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          new_slug = os.environ.get("NEW_SLUG", "").strip()
          json_path = os.environ.get("JSON_FILE_PATH", "")

          if not new_slug:
              print("No new slug found. Skipping FCM notification.")
              exit(0)

          post_title = "New Temple Post"
          try:
              if os.path.exists(json_path):
                  with open(json_path, 'r', encoding='utf-8') as f:
                      posts = json.load(f)
                      for post in posts:
                          if post.get("slug") == new_slug:
                              post_title = post.get("title", post_title)
                              break
          except Exception as e:
              print(f"Error parsing post title from json: {e}")

          image_url = f"https://www.templepages.com/posts/{new_slug}/img1.jpg"

          raw_json = os.environ.get("SERVICE_ACCOUNT", "")
          key_data = json.loads(raw_json)

          creds = service_account.Credentials.from_service_account_info(
              key_data,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          creds.refresh(Request())

          project_id = key_data["project_id"]
          commit_sha = os.environ.get("COMMIT_SHA", "")

          url = f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send"
          headers = {
              "Authorization": f"Bearer {creds.token}",
              "Content-Type": "application/json"
          }

          payload = {
              "message": {
                  "topic": "updates",
                  "notification": {
                      "title": post_title,
                      "body": "Tap to view full temple details",
                      "image": image_url
                  },
                  "data": {
                      "newslug": new_slug,
                      "version": commit_sha,
                      "url": "https://www.templepages.com/posts.json",
                      "title": post_title,
                      "image_url": image_url
                  },
                  "android": {
                      "priority": "HIGH",
                      "notification": {
                          "image": image_url
                      }
                  }
              }
          }

          res = requests.post(url, json=payload, headers=headers)
          print("FCM Response Code:", res.status_code)
          print("FCM Response Body:", res.text)

          if res.status_code != 200:
              exit(1)
          EOF
