name: Notify Mobile Clients

on:
  push:
    branches:
      - main  # Triggers when changes are pushed to main
    paths:
      # Action ONLY triggers when posts.json is modified
      - 'templepages-github-site/www.templepages.com/posts.json'

jobs:
  send-fcm-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required to compare current commit against parent commit

      - name: Extract New Slug via Git Diff
        id: extract_slug
        run: |
          JSON_PATH="templepages-github-site/www.templepages.com/posts.json"
          
          # Isolate added lines in posts.json containing the "slug" field
          NEW_SLUG=$(git diff HEAD~1 HEAD -- "$JSON_PATH" | grep '^+[^+]' | grep '"slug":' | sed -E 's/.*"slug": *"([^"]+)".*/\1/' | head -n 1)

          if [ -z "$NEW_SLUG" ]; then
            echo "No new slug detected in git diff."
          else
            echo "Detected new slug: $NEW_SLUG"
          fi

          echo "slug=$NEW_SLUG" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Send FCM Notification
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          NEW_SLUG: ${{ steps.extract_slug.outputs.slug }}
        run: |
          python - << 'EOF'
          import os, json, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          new_slug = os.environ.get("NEW_SLUG", "").strip()

          if not new_slug:
              print("No new slug found in posts.json diff. Skipping FCM notification.")
              exit(0)

          # 1. Parse Firebase Key from GitHub Secrets
          raw_json = os.environ.get("SERVICE_ACCOUNT", "")
          key_data = json.loads(raw_json)

          # 2. Get Google OAuth2 Token
          creds = service_account.Credentials.from_service_account_info(
              key_data,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          creds.refresh(Request())

          project_id = key_data["project_id"]
          commit_sha = os.environ.get("COMMIT_SHA", "")
          commit_msg = os.environ.get("COMMIT_MSG", "Temple updates published")

          # 3. Construct FCM v1 Request
          url = f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send"
          headers = {
              "Authorization": f"Bearer {creds.token}",
              "Content-Type": "application/json"
          }

          # 4. Clean Payload containing the newly added slug
          payload = {
              "message": {
                  "topic": "updates",
                  "data": {
                      "newslug": new_slug,
                      "version": commit_sha,
                      "url": "https://www.templepages.com/posts.json",
                      "message": commit_msg
                  },
                  "android": {
                      "priority": "HIGH"
                  }
              }
          }

          # 5. Send Notification
          res = requests.post(url, json=payload, headers=headers)
          print("FCM Response Code:", res.status_code)
          print("FCM Response Body:", res.text)

          if res.status_code != 200:
              exit(1)
          EOF
