name: Notify Mobile Clients

on:
  push:
    branches:
      - main  # Change to 'master' or 'gh-pages' if that's your primary branch

jobs:
  send-fcm-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Send FCM Notification
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python - << 'EOF'
          import os, json, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          # Load key from GitHub Secret
          raw_json = os.environ.get("SERVICE_ACCOUNT", "")
          key_data = json.loads(raw_json)

          creds = service_account.Credentials.from_service_account_info(
              key_data,
              scopes=["https://www.googleapis.com/auth/firebase.messaging"]
          )
          creds.refresh(Request())

          project_id = key_data["project_id"]
          commit_sha = os.environ.get("COMMIT_SHA", "")
          commit_msg = os.environ.get("COMMIT_MSG", "New update published")

          # Construct FCM HTTP v1 request
          url = f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send"
          headers = {
              "Authorization": f"Bearer {creds.token}",
              "Content-Type": "application/json"
          }

          payload = {
              "message": {
                  "topic": "updates",
                  "data": {
                      "version": commit_sha,
                      "url": f"https://codydady.github.io/projects/content-{commit_sha}.json",
                      "message": commit_msg
                  }
              }
          }

          res = requests.post(url, json=payload, headers=headers)
          print("FCM Response Code:", res.status_code)
          print("FCM Response Body:", res.text)

          if res.status_code != 200:
              exit(1)
          EOF
